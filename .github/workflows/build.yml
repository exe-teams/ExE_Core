name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace --no-daemon

      - name: Verify release JAR
        id: artifact
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'execore-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar_path"
          jar tf "$jar_path" > "$RUNNER_TEMP/execore-jar-contents.txt"
          grep -Fxq 'LICENSE.txt' "$RUNNER_TEMP/execore-jar-contents.txt"
          grep -Fxq 'META-INF/mods.toml' "$RUNNER_TEMP/execore-jar-contents.txt"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: execore-${{ github.sha }}
          path: ${{ steps.artifact.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 14
